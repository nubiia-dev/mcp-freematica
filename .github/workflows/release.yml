name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Validate + Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and provenance

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@nubiia'
          cache: 'npm'

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; npm@latest (12+) requires Node >= 22.
      - name: Update npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Check coverage threshold (85%)
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json 2>/dev/null | node -e "
            const data = require('fs').readFileSync('/dev/stdin', 'utf8');
            const json = JSON.parse(data);
            const pct = json.total.lines.pct;
            console.log(pct);
          " 2>/dev/null || echo "0")
          echo "Line coverage: ${COVERAGE}%"
          node -e "
            const pct = parseFloat('${COVERAGE}');
            if (isNaN(pct) || pct < 85) {
              console.error('Coverage ' + pct + '% is below 85% threshold');
              process.exit(1);
            }
            console.log('Coverage ' + pct + '% meets 85% threshold');
          "

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      # No NPM_TOKEN: npm exchanges the job's OIDC identity for a short-lived publish
      # credential via the package's npm Trusted Publisher (nubiia-dev/mcp-freematica,
      # workflow release.yml).
      - name: Publish to npm
        run: npm publish --access public --provenance
