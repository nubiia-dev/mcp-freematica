name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Validate + Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and provenance

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@nubiia'
          cache: 'npm'

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; npm@latest (12+) requires Node >= 22.
      - name: Update npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Check coverage threshold (85%)
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json 2>/dev/null | node -e "
            const data = require('fs').readFileSync('/dev/stdin', 'utf8');
            const json = JSON.parse(data);
            const pct = json.total.lines.pct;
            console.log(pct);
          " 2>/dev/null || echo "0")
          echo "Line coverage: ${COVERAGE}%"
          node -e "
            const pct = parseFloat('${COVERAGE}');
            if (isNaN(pct) || pct < 85) {
              console.error('Coverage ' + pct + '% is below 85% threshold');
              process.exit(1);
            }
            console.log('Coverage ' + pct + '% meets 85% threshold');
          "

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      # No NPM_TOKEN: npm exchanges the job's OIDC identity for a short-lived publish
      # credential via the package's npm Trusted Publisher (nubiia-dev/mcp-freematica,
      # workflow release.yml).
      - name: Publish to npm
        run: npm publish --access public --provenance

      # server.json lleva la versión del paquete; se sincroniza aquí con package.json
      # para que el MCP Registry siempre registre la versión que se acaba de publicar.
      - name: Sync server.json version with package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION="$VERSION" node -e "
            const fs = require('fs');
            const server = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            server.version = process.env.VERSION;
            for (const pkg of server.packages ?? []) pkg.version = process.env.VERSION;
            fs.writeFileSync('server.json', JSON.stringify(server, null, 2) + '\\n');
          "
          cat server.json

      # npm tarda unos segundos en servir una versión recién publicada y el
      # registro MCP la valida contra npm: sin esta espera, publish falla con
      # "version not found" (pasó en mcp-borme 1.0.1).
      - name: Wait for the version to be visible on npm
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
              echo "$PKG@$VERSION is available on npm"
              exit 0
            fi
            echo "Waiting for $PKG@$VERSION on npm ($i/30)..."
            sleep 10
          done
          echo "::error::$PKG@$VERSION did not appear on npm after 5 minutes"
          exit 1

      - name: Download MCP Publisher
        run: |
          curl -L https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Authenticate with MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
